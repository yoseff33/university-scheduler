name: Deploy Vibes to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # هذا يخلي الـWorkflow يقدر يقرأ الأسرار الموجودة
    # داخل Environment باسم github-pages
    environment:
      name: github-pages

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت المكتبات
        run: npm ci

      - name: بناء الموقع مع Supabase
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_NAME: فايبز
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL }}

      - name: تجهيز GitHub Pages
        uses: actions/configure-pages@v5

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v4
